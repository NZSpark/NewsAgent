[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsagent"
version = "0.1.0"
description = "AI News Agent: fetch, dedup, cluster, and summarize AI news with local LLMs"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "selectolax>=0.3",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "openai>=1.40",
    "pyyaml>=6.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
news = "newsagent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
